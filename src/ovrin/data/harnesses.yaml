harnesses:
- id: codex-cli
  name: OpenAI Codex CLI
  open_source: true
  reads:
  - AGENTS.md
  - AGENTS.override.md
  walks_tree: true
  walks_ancestors: true
  respects_ignore: unknown
  precedence: nearest-first
  max_doc_bytes: 32768
  confidence: documented
  source: Codex docs
  note: Codex combines instruction files from repo root down to the working directory. AGENTS.override.md wins only within its own directory; it does not delete a root-level instruction. 32 KiB default truncation.
  claims:
    root_loading:
      value: true
      confidence: documented
    nested_loading:
      value: true
      confidence: documented
    ancestor_loading:
      value: true
      confidence: documented
    ignore_behavior:
      value: unknown
      confidence: unknown
    override_semantics:
      value: combine-root-to-cwd; override wins within a directory, does not delete ancestors
      confidence: documented
