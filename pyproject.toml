[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovrin"
version = "0.1.0"
description = "Inventory the instruction files your coding agent reads as configuration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yuvraj Pradhan" }]
keywords = [
  "agentic-ai", "supply-chain-security", "agents-md", "provenance",
  "sbom", "codeowners", "llm-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0", "pathspec>=0.12"]

[project.optional-dependencies]
survey = ["httpx>=0.27"]
sign = ["cryptography>=42"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ovrin = "ovrin.cli:main"

[project.urls]
Homepage = "https://github.com/Uvi-12/ovrin"
Issues = "https://github.com/Uvi-12/ovrin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ovrin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
